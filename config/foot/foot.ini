shell=fish
title=foot
font=JetBrains Mono Nerd Font:size=12
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

[colors-dark]
alpha=0.78
alpha-mode=matching
blur=yes
foreground=e2e2e2
background=131313

## Обычные цвета (оттенки серого от тёмного к светлому)
regular0=252525 # black
regular1=858585 # red -> dark gray
regular2=a0a0a0 # green -> gray
regular3=b5b5b5 # yellow -> light gray
regular4=c6c6c6 # blue -> light gray
regular5=d0d0d0 # magenta -> gray
regular6=dedede # cyan -> bright gray
regular7=ffffff # white

## Яркие цвета
bright0=454545 # bright black
bright1=909090 # bright red
bright2=aaaaaa # bright green
bright3=c0c0c0 # bright yellow
bright4=d5d5d5 # bright blue
bright5=e0e0e0 # bright magenta
bright6=eeeeee # bright cyan
bright7=ffffff # bright white

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
